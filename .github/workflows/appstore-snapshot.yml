name: App Store snapshot
on:
  schedule:
    - cron: '7 7 * * *' # 07:07 UTC, prima del controllo Devvit delle 08:17
  workflow_dispatch:
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Leggi App Store e scrivi su Slack
        env:
          SLACK_TOKEN: ${{ secrets.SLACK_TOKEN }}
          SLACK_CHANNEL: ${{ secrets.SLACK_CHANNEL }}
          # Stessi id di APPS in src/server/krevn.ts
          APP_IDS: '6780602824 6769732967 6826930326'
        run: |
          set -euo pipefail
          # Un messaggio per app: Slack taglia i testi oltre 4000 caratteri.
          for id in $APP_IDS; do
            raw=$(curl -fsS "https://itunes.apple.com/lookup?id=$id&country=it")
            for n in 900 600 300 0; do
              r=$(jq -c --argjson n "$n" '(.results[0] // null) | if . then {version, trackViewUrl, trackName, formattedPrice, primaryGenreName,
                description: ((.description // "")[:$n]), releaseNotes: ((.releaseNotes // "")[:($n * 1.3 | floor)])} else null end' <<<"$raw")
              b64=$(printf '%s' "$r" | base64 -w0)
              [ ${#b64} -le 3900 ] && break
            done
            [ ${#b64} -le 3900 ] || { echo "snapshot $id troppo lungo"; exit 1; }
            curl -fsS -X POST https://slack.com/api/chat.postMessage \
              -H "Authorization: Bearer $SLACK_TOKEN" \
              -H 'Content-Type: application/json; charset=utf-8' \
              -d "$(jq -nc --arg c "$SLACK_CHANNEL" --arg t "krevn-snapshot $id $b64" '{channel: $c, text: $t}')" \
              | jq -e '.ok' >/dev/null
          done
